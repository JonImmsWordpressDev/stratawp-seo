name: Code quality

# Lint, coding standards, static analysis, and unit tests. PRs are
# gated via the pull_request trigger; main is checked post-merge. (No
# feature/chore push triggers — combined with pull_request they ran CI
# twice per PR.)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint all PHP files
        run: |
          find stratawp-seo.php uninstall.php includes admin templates \
            -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

  coding-standards:
    name: PHPCS (WordPress)
    runs-on: ubuntu-latest
    # Hard gate. Findings that predate the gate are listed in
    # phpcs.baseline.xml and ignored; any NEW finding fails the build.
    # Fixing old ones? Regenerate the baseline so it shrinks:
    #   composer lint:baseline
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: cs2pr
      - name: Validate composer.json
        run: composer validate --strict --no-check-publish
      - uses: ramsey/composer-install@v3
      - name: Run PHP_CodeSniffer
        # pipefail: a PHPCS crash must fail the job, not vanish behind cs2pr.
        shell: bash
        run: |
          set -o pipefail
          # -q: phpcs.xml.dist turns on progress output (arg "ps"), which
          # would otherwise wrap the checkstyle XML and break cs2pr.
          composer lint -- -q --report=checkstyle | cs2pr

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: Run PHPStan
        run: composer analyze -- --no-progress --error-format=github

  unit-tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: Run PHPUnit
        run: composer test

  # Real WordPress + MySQL: locks, AJAX/REST handlers, permissions, schema,
  # uninstall — everything the stubbed unit suite can't reach.
  # WordPress matrix: the latest 7.0.x and 7.1.x releases, plus nightly
  # (the next major's beta/RC). Nightly only warns: continue-on-error.
  integration-tests:
    name: WordPress ${{ matrix.wp }} integration (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.4']
        wp: ['7.0', '7.1', 'nightly']
        include:
          - wp: '7.0'
            core: '~7.0.0'
            tests: '~7.0.0'
            prerelease: false
          - wp: '7.1'
            core: '~7.1.0'
            tests: '~7.1.0'
            prerelease: false
          - wp: 'nightly'
            core: 'dev-main'
            tests: 'dev-master'
            prerelease: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: swps_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: Install WordPress ${{ matrix.wp }}
        run: >-
          composer require --dev --with-all-dependencies
          --no-interaction --no-progress
          "roots/wordpress-no-content:${{ matrix.core }}"
          "wp-phpunit/wp-phpunit:${{ matrix.tests }}"
      - name: Show WordPress version
        run: grep "^\$wp_version" vendor/roots/wordpress-no-content/wp-includes/version.php
      - name: Run integration suite
        env:
          WP_TESTS_DB_HOST: 127.0.0.1:3306
        run: composer test:integration

  editor-js:
    name: Editor sidebar (tests and committed build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Vitest
        run: npm run test:js
      - name: Committed build matches sources
        run: npm run verify:build
