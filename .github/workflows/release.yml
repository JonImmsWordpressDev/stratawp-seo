name: Build & release plugin zip

# Builds a production-ready WordPress plugin zip and publishes it as a GitHub
# Release whenever the version in stratawp-seo.php changes.
#
# The README links to:
#   releases/latest/download/stratawp-seo.zip
# which always resolves to the asset attached to the most recent release.

on:
  push:
    branches:
      - main
    paths:
      - 'stratawp-seo.php'
      - 'includes/**'
      - 'admin/**'
      - 'templates/**'
      - 'css/**'
      - 'readme.txt'
      - 'uninstall.php'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read plugin version from stratawp-seo.php
        id: ver
        run: |
          VERSION=$(grep -E "^[[:space:]]*\*[[:space:]]*Version:" stratawp-seo.php | head -1 | awk -F': ' '{print $2}' | tr -d ' \r')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read Version: header from stratawp-seo.php"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"

      - name: Check if release already exists for this version
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.ver.outputs.version }} already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release zips
        if: steps.exists.outputs.exists == 'false'
        run: |
          # Two zips from one tree — see bin/build-zip.sh.
          #   stratawp-seo.zip        GitHub release, carries the provenance
          #                           marker that enables the self-updater
          #   stratawp-seo-wporg.zip  WordPress.org upload, no marker, no dev
          #                           tooling, so the directory owns updates
          # The script verifies each zip and deletes any that fails.
          ./bin/build-zip.sh --target github
          ./bin/build-zip.sh --target wporg
          ls -lh build/*.zip

      - name: Publish GitHub Release
        if: steps.exists.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          files: |
            build/stratawp-seo.zip
            build/stratawp-seo-wporg.zip
          generate_release_notes: true
          make_latest: true
